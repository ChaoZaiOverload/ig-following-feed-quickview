<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Feed Settings</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; padding: 32px; max-width: 400px; color: #262626; }
        h1 { font-size: 16px; margin-bottom: 24px; }
        label { display: block; font-size: 14px; margin-bottom: 8px; }
        input[type=number] { width: 80px; padding: 6px 10px; font-size: 14px; border: 1px solid #dbdbdb; border-radius: 4px; }
        button { margin-top: 20px; padding: 8px 20px; font-size: 14px; background: #0095f6; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #1877f2; }
        #saved { margin-top: 12px; font-size: 13px; color: #8e8e8e; display: none; }
    </style>
</head>
<body>
    <h1>Instagram Feed Settings</h1>

    <label for="hours">Show posts from the last <input type="number" id="hours" min="1" max="168" value="48" /> hours</label>

    <label style="margin-top:24px;display:block;">
        <span style="font-weight:600;">Instagram App ID</span><br>
        <span style="font-size:12px;color:#8e8e8e;display:block;margin:4px 0 8px;">
            Instagram's own web client ID — shared by all users. Only change this if requests start failing (Instagram occasionally updates it).
            To find the current value: open instagram.com, DevTools → Network → any <code>/api/graphql</code> request → Request Headers → <code>x-ig-app-id</code>.
        </span>
        <input type="text" id="appId" style="width:100%;padding:6px 10px;font-size:13px;border:1px solid #dbdbdb;border-radius:4px;font-family:monospace;" />
    </label>

    <button id="save">Save</button>
    <div id="saved">✓ Saved — cache will refresh on next load</div>
    <script src="options.js"></script>
</body>
</html>

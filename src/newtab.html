<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #dbdbdb; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
        #header h1 { font-size: 15px; font-weight: 600; }
        #status { font-size: 13px; color: #8e8e8e; margin-left: auto; }
        #refresh { padding: 5px 12px; font-size: 13px; background: none; border: 1px solid #dbdbdb; border-radius: 6px; cursor: pointer; color: #262626; margin-left: 12px; }
        #refresh:hover { background: #fafafa; }
        #refresh:disabled { color: #8e8e8e; cursor: default; }
        #feed { max-width: 960px; margin: 16px auto; padding: 0 16px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; align-items: start; }
        .card { background: #fff; border: 1px solid #dbdbdb; border-radius: 4px; overflow: hidden; }
        .card-header { display: flex; align-items: center; padding: 6px 8px; gap: 6px; }
        .card-header img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .card-header a.username { font-weight: 600; font-size: 13px; color: #262626; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-header a.username:hover { text-decoration: underline; }
        .time { margin-left: auto; color: #8e8e8e; font-size: 11px; white-space: nowrap; }
        .card-img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
        .card-caption { padding: 6px 8px; font-size: 12px; color: #262626; white-space: pre-wrap; word-break: break-word; }
        #message { text-align: center; padding: 60px 20px; color: #8e8e8e; font-size: 14px; }
    </style>
</head>
<body>
    <div id="header">
        <h1>Instagram · Chronological Feed</h1>
        <span id="status"></span>
        <button id="refresh">↻ Refresh</button>
    </div>
    <div id="message">Fetching posts from people you follow...</div>
    <div id="feed"></div>
    <script src="src/newtab.js"></script>
</body>
</html>

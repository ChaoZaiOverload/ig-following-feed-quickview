<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instagram Feed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        #header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #dbdbdb; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
        #header h1 { font-size: 15px; font-weight: 600; flex-shrink: 0; }
        #status { font-size: 13px; color: #8e8e8e; margin-left: auto; white-space: nowrap; }
        #progress { display: flex; align-items: center; gap: 7px; min-width: 235px; }
        #progress[hidden] { display: none; }
        #progress-label { width: 145px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #8e8e8e; font-size: 11px; text-align: right; }
        #progress-track { width: 82px; height: 5px; overflow: hidden; border-radius: 3px; background: #efefef; }
        #progress-bar { width: 0; height: 100%; border-radius: inherit; background: #0095f6; transition: width 0.18s ease; }
        #refresh { padding: 5px 12px; font-size: 13px; background: none; border: 1px solid #dbdbdb; border-radius: 6px; cursor: pointer; color: #262626; flex-shrink: 0; }
        #refresh:hover { background: #fafafa; }
        #refresh:disabled { color: #8e8e8e; cursor: default; }
        #mode-tabs { display: flex; gap: 4px; flex-shrink: 0; }
        .mode-tab { padding: 5px 14px; font-size: 13px; border: 1px solid #dbdbdb; border-radius: 6px; cursor: pointer; color: #262626; background: none; font-family: inherit; white-space: nowrap; }
        .mode-tab.active { background: #262626; color: #fff; border-color: #262626; }
        .mode-tab:not(.active):hover { background: #f5f5f5; }

        #user-picker { background: #fff; border-bottom: 1px solid #dbdbdb; padding: 10px 20px; display: none; }
        #user-search { width: 100%; max-width: 320px; padding: 7px 12px; font-size: 14px; border: 1px solid #dbdbdb; border-radius: 8px; outline: none; font-family: inherit; }
        #user-search:focus { border-color: #a8a8a8; }
        #user-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 110px; overflow-y: auto; }
        .user-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid #dbdbdb; border-radius: 20px; cursor: pointer; font-size: 13px; background: #fff; font-family: inherit; transition: background 0.1s; }
        .user-chip:hover { background: #f0f7ff; border-color: #0095f6; }
        .user-chip.selected { background: #0095f6; color: #fff; border-color: #0095f6; }
        .user-chip img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
        .fav-btn { font-size: 11px; line-height: 1; background: none; border: none; padding: 0; cursor: pointer; color: #f0a500; opacity: 0; transition: opacity 0.1s; font-family: inherit; }
        .user-chip:hover .fav-btn, .user-chip.favorited .fav-btn { opacity: 1; }
        .user-chip.selected .fav-btn { color: #fff; }
        .fav-divider { flex-basis: 100%; height: 1px; background: #efefef; margin: 2px 0; }
        #user-hint { font-size: 13px; color: #8e8e8e; padding: 4px 0; }

        #feed { max-width: 1400px; margin: 16px auto; padding: 0 16px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; align-items: start; }

        /* All-following cards */
        .card { background: #fff; border: 1px solid #dbdbdb; border-radius: 4px; overflow: hidden; }
        .card-header { display: flex; align-items: center; padding: 6px 8px; gap: 6px; }
        .card-header img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .card-header a.username { font-weight: 600; font-size: 13px; color: #262626; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card-header a.username:hover { text-decoration: underline; }
        .time { color: #8e8e8e; font-size: 11px; white-space: nowrap; }
        .card-header .time { margin-left: auto; }
        .card-img-wrap { position: relative; }
        .card-img { width: 100%; display: block; aspect-ratio: 1; object-fit: cover; }
        .carousel-badge { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.55); color: #fff; font-size: 10px; padding: 2px 5px; border-radius: 10px; pointer-events: none; }
        .card-caption { padding: 6px 8px; font-size: 12px; color: #262626; white-space: pre-wrap; word-break: break-word; border-top: 1px solid #f5f5f5; }

        /* Single-user post rows */
        .card-post { grid-column: 1 / -1; padding: 6px 0 10px; border-bottom: 1px solid #efefef; }
        .card-post .post-meta { display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
        .card-post .post-meta a { font-size: 11px; color: #0095f6; text-decoration: none; }
        .card-post .post-meta a:hover { text-decoration: underline; }
        .card-post .post-images { display: flex; flex-wrap: wrap; gap: 6px; }
        .card-post .card-img-wrap { flex: 0 0 calc((100% - 24px) / 5); min-width: 0; border-radius: 3px; overflow: hidden; }
        .card-post .card-caption { padding: 6px 0 0; border: none; font-size: 12px; color: #262626; white-space: pre-wrap; word-break: break-word; }

        #message { text-align: center; padding: 60px 20px; color: #8e8e8e; font-size: 14px; }

        #risk-alert { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0, 0, 0, 0.55); }
        #risk-alert[hidden] { display: none; }
        .risk-alert-card { width: 100%; max-width: 460px; padding: 24px; border-radius: 12px; background: #fff; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.24); }
        .risk-alert-card h2 { margin-bottom: 12px; font-size: 18px; color: #262626; }
        .risk-alert-card p { color: #4a4a4a; font-size: 14px; line-height: 1.5; }
        #acknowledge-risk { display: block; width: 100%; margin-top: 20px; padding: 9px 16px; border: 0; border-radius: 8px; background: #0095f6; color: #fff; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600; }
        #acknowledge-risk:hover { background: #1877f2; }
        #acknowledge-risk:focus-visible { outline: 3px solid rgba(0, 149, 246, 0.35); outline-offset: 2px; }
        #acknowledge-risk:disabled { opacity: 0.65; cursor: default; }
    </style>
</head>
<body>
    <div id="risk-alert" role="alertdialog" aria-modal="true" aria-labelledby="risk-alert-title" aria-describedby="risk-alert-message" hidden>
        <div class="risk-alert-card">
            <h2 id="risk-alert-title">Account safety warning</h2>
            <p id="risk-alert-message">Using this extension may unintentionally trigger Facebook's detection of high risk in the account and cause it to request an email or password reset. Use it with caution.</p>
            <button id="acknowledge-risk" type="button">Note the risk</button>
        </div>
    </div>
    <div id="header">
        <h1>Instagram Feed</h1>
        <div id="mode-tabs">
            <button class="mode-tab active" id="tab-all">All Following</button>
            <button class="mode-tab" id="tab-user">One User</button>
        </div>
        <span id="status"></span>
        <div id="progress" role="progressbar" aria-label="Loading feed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
            <span id="progress-label">0% · Estimating…</span>
            <div id="progress-track"><div id="progress-bar"></div></div>
        </div>
        <button id="refresh">↻ Refresh</button>
    </div>
    <div id="user-picker">
        <input id="user-search" type="text" placeholder="Search by username…" autocomplete="off" />
        <div id="user-list"><span id="user-hint">Loading following list…</span></div>
    </div>
    <div id="message">Fetching posts from people you follow...</div>
    <div id="feed"></div>
    <script src="newtab.js"></script>
</body>
</html>
